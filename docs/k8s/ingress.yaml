apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cooperise-ingress
  namespace: qianjisan
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: cooperise.qianjisan.com          # ← 替换为你的域名
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: faiz
                port:
                  number: 80