apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperise
  namespace: qianjisan
  labels:
    app: cooperise
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cooperise
  template:
    metadata:
      labels:
        app: cooperise
    spec:
      # ↓↓↓ 添加这一行 ↓↓↓
      imagePullSecrets:
        - name: aliyun-registry-secret
      # ↑↑↑ 添加这一行 ↑↑↑
      containers:
        - name: cooperise
          image: registry.cn-shanghai.aliyuncs.com/qianjisan/cooperise:2026-11-23-18-03-20  # ← 替换为你的实际镜像地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: faiz-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          # 本镜像是 nginx 静态站点（无 Spring Boot actuator），探针走 /：SPA 兜底返回 200
          # 注意：/actuator/... 在 nginx 上会 404，探针一直失败会导致 Pod 永远不 Ready 并被反复重启
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3