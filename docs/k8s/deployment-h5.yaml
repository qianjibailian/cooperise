apiVersion: apps/v1
kind: Deployment
metadata:
  name: cooperise-h5
  namespace: qianjisan
  labels:
    app: cooperise-h5
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cooperise-h5
  template:
    metadata:
      labels:
        app: cooperise-h5
    spec:
      imagePullSecrets:
        - name: aliyun-registry-secret
      containers:
        - name: cooperise-h5
          image: registry.cn-shanghai.aliyuncs.com/qianjisan/cooperise-h5:<TAG>  # ← 替换为 Dockerfile 构建的镜像 tag
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          # nginx 静态站点：探针走 /h5/（根路径 / 返回 404，会导致 Pod 不 Ready）
          startupProbe:
            httpGet:
              path: /h5/
              port: 80
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /h5/
              port: 80
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /h5/
              port: 80
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: cooperise-h5
  namespace: qianjisan
  labels:
    app: cooperise-h5
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: cooperise-h5
