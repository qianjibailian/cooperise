<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      手机 H5（独立入口，见 src/h5/）：
      - viewport-fit=cover：内容铺满刘海 / 灵动岛 / 底部横条区域，再用 env(safe-area-inset-*) 留出安全区
      - 禁止双指缩放：避免点输入框时页面被放大（输入框字号也统一 ≥16px）
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="format-detection" content="telephone=no,email=no" />
    <!-- 添加到主屏幕后以全屏 App 形式打开 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Cooperise" />
    <title>Cooperise</title>
  </head>
  <body>
    <noscript>请开启浏览器的 JavaScript 后使用 Cooperise。</noscript>
    <div id="app"></div>
    <script type="module" src="/src/h5/main.ts"></script>
  </body>
</html>
